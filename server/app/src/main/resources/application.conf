ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.crowdodge.app.ApplicationKt.module ]
    }
}

crowdodge {
    database {
        # 認証情報は URL に埋め込まず分離（R2DBC は ConnectionFactoryOptions、Flyway は JDBC 別引数）
        host = "localhost"
        host = ${?DB_HOST}
        port = 5432
        port = ${?DB_PORT}
        name = "crowdodge"
        name = ${?DB_NAME}
        username = "crowdodge"
        username = ${?DB_USER}
        password = "crowdodge"
        password = ${?DB_PASSWORD}
        sslMode = "disable"
        sslMode = ${?DB_SSL_MODE}
        pgbouncer = false
        pgbouncer = ${?DB_PGBOUNCER}
    }
    migrationDatabase {
        host = "localhost"
        host = ${?MIGRATION_DB_HOST}
        port = 5432
        port = ${?MIGRATION_DB_PORT}
        name = "crowdodge"
        name = ${?MIGRATION_DB_NAME}
        username = "crowdodge"
        username = ${?MIGRATION_DB_USER}
        password = "crowdodge"
        password = ${?MIGRATION_DB_PASSWORD}
        sslMode = "disable"
        sslMode = ${?MIGRATION_DB_SSL_MODE}
    }
    googleCalendar {
        # HTTP service と watch renewal Job は同じ Google Calendar 設定を使用する。
        apiBaseUrl = "https://www.googleapis.com"
        apiBaseUrl = ${?GOOGLE_CALENDAR_API_BASE_URL}
        webhookUrl = ""
        webhookUrl = ${?GOOGLE_CALENDAR_WEBHOOK_URL}
        channelToken = ""
        channelToken = ${?GOOGLE_CALENDAR_CHANNEL_TOKEN}
        fullSyncWindowDays = 90
        fullSyncWindowDays = ${?GOOGLE_CALENDAR_FULL_SYNC_WINDOW_DAYS}
        oauthTokenUrl = "https://oauth2.googleapis.com/token"
        oauthTokenUrl = ${?GOOGLE_OAUTH_TOKEN_URL}
        oauthJwksUrl = "https://www.googleapis.com/oauth2/v3/certs"
        oauthJwksUrl = ${?GOOGLE_OAUTH_JWKS_URL}
        oauthClientId = ""
        oauthClientId = ${?GOOGLE_OAUTH_CLIENT_ID}
        oauthClientSecret = ""
        oauthClientSecret = ${?GOOGLE_OAUTH_CLIENT_SECRET}
        tokenEncryptionKey = ""
        tokenEncryptionKey = ${?GOOGLE_TOKEN_ENCRYPTION_KEY}
    }
    auth {
        jwt {
            secret = ""
            secret = ${?APP_JWT_SECRET}
            issuer = "crowdodge-api"
            issuer = ${?APP_JWT_ISSUER}
            audience = "crowdodge-app"
            audience = ${?APP_JWT_AUDIENCE}
            accessTokenTtlSeconds = 900
            accessTokenTtlSeconds = ${?APP_JWT_ACCESS_TTL_SECONDS}
            refreshTokenTtlSeconds = 2592000
            refreshTokenTtlSeconds = ${?APP_JWT_REFRESH_TTL_SECONDS}
        }
    }
}
