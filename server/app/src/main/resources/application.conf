ktor {
    development = true
    deployment {
        port = 8080
        port = ${?PORT}
        watch = [classes, resources]
    }
    application {
        modules = [ com.crowdodge.app.ApplicationKt.module ]
    }
}

crowdodge {
    database {
        # 認証情報は URL に埋め込まず分離（R2DBC は ConnectionFactoryOptions、Flyway は JDBC 別引数）
        host = "localhost"
        host = ${?DB_HOST}
        port = 5432
        port = ${?DB_PORT}
        name = "crowdodge"
        name = ${?DB_NAME}
        username = "crowdodge"
        username = ${?DB_USER}
        password = "crowdodge"
        password = ${?DB_PASSWORD}
    }
}
