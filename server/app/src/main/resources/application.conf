ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.crowdodge.app.ApplicationKt.module ]
    }
}

crowdodge {
    database {
        # 認証情報は URL に埋め込まず分離（R2DBC は ConnectionFactoryOptions、Flyway は JDBC 別引数）
        host = "localhost"
        host = ${?DB_HOST}
        port = 5432
        port = ${?DB_PORT}
        name = "crowdodge"
        name = ${?DB_NAME}
        username = "crowdodge"
        username = ${?DB_USER}
        password = "crowdodge"
        password = ${?DB_PASSWORD}
        sslMode = "disable"
        sslMode = ${?DB_SSL_MODE}
        pgbouncer = false
        pgbouncer = ${?DB_PGBOUNCER}
    }
    migrationDatabase {
        host = "localhost"
        host = ${?MIGRATION_DB_HOST}
        port = 5432
        port = ${?MIGRATION_DB_PORT}
        name = "crowdodge"
        name = ${?MIGRATION_DB_NAME}
        username = "crowdodge"
        username = ${?MIGRATION_DB_USER}
        password = "crowdodge"
        password = ${?MIGRATION_DB_PASSWORD}
        sslMode = "disable"
        sslMode = ${?MIGRATION_DB_SSL_MODE}
    }
}
